<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 170" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Wordmark 'x' Accent Gradient -->
    <linearGradient id="xAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Dark Banner Card -->
  <rect width="750" height="170" rx="16" fill="url(#bgGrad)"/>
  <rect width="748" height="168" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Left Decorative Security Bar -->
  <rect x="40" y="35" width="5" height="100" rx="2.5" fill="url(#xAccent)"/>

  <!-- Main Wordmark: xvelope -->
  <text x="65" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" font-size="58" letter-spacing="-1.5">
    <tspan fill="url(#xAccent)">x</tspan><tspan fill="#F8FAFC">velope</tspan>
  </text>

  <!-- ASP.NET Core Identity Line -->
  <text x="67" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#94A3B8">
    Secure Stateless Auth for Go <tspan fill="#475569">•</tspan> Inspired by <tspan fill="#38BDF8" font-weight="600">ASP.NET Core Identity</tspan>
  </text>

  <!-- Technical Capabilities Line -->
  <text x="67" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#64748B" letter-spacing="0.5">
    AES-256-GCM Encrypted Cookies &amp; Opaque Bearer Tokens
  </text>
</svg>
